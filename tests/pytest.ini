[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=reports/test_report.html --self-contained-html
markers =
    auth: Authentication and Authorization tests
    user: User profile and management tests
    vehicle: EV Vehicle registration and management tests
    station: Station discovery, search, and availability tests
    booking: Slot reservation and booking lifecycle tests
    payment: Payment simulation and Razorpay flow tests
    admin: Admin portal, charger management, and maintenance tests
    reviews: Review submission and rating tests
    notifications: In-app notification tests
    chat: AI assistant and ChargeBot tests
    navigation: UI links, responsiveness, and page navigation tests
