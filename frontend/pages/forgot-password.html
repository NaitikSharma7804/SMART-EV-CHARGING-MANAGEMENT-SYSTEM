<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EV Charge Hub</title>
    <meta name="description" content="Reset your EV Charge Hub account password securely.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium-ui.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.auth-page {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.12), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(34, 197, 94, 0.08), transparent 30%),
                #f6f8f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #17201b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: #ffffff;
            border: 1px solid #e5ebe7;
            border-radius: 20px;
            padding: 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #111827;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 24px;
        }
        .brand-logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: #22c55e;
            color: #052e16;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 800;
            color: #111827;
        }
        p {
            margin: 0 0 24px;
            color: #6b766f;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #e5ebe7;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #9ca3af;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #22c55e;
            color: #052e16;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            background: #16a34a;
            color: #ffffff;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13.5px;
            font-weight: 600;
            color: #15803d;
            text-decoration: none;
        }
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .alert-success {
            background: #ecfdf3;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body class="auth-page">
    <div class="reset-card">
        <a href="../index.html" class="brand-logo">
            <span class="brand-logo-icon"><i data-lucide="zap"></i></span>
            EV Charge Hub
        </a>

        <h2>Forgot Password?</h2>
        <p>Enter the email address registered with your EV Charge Hub account and we'll send you instructions to reset your password.</p>

        <div id="alertBox" class="alert-box"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Account Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" required placeholder="name@example.com" autocomplete="email">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i data-lucide="send" style="width: 17px; height: 17px;"></i>
                <span>Send Reset Link</span>
            </button>
        </form>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <div style="margin-top: 24px; padding-top: 14px; border-top: 1px solid #e5ebe7; text-align: center; font-size: 12px; color: #6b766f; display: flex; justify-content: center; gap: 14px;">
            <a href="privacy.html" style="color: #6b766f; text-decoration: underline;">Privacy Policy</a>
            <span>•</span>
            <a href="terms.html" style="color: #6b766f; text-decoration: underline;">Terms of Service</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            btn.disabled = true;
            btn.innerHTML = '<span>Sending...</span>';
            alertBox.style.display = 'none';

            try {
                const res = await apiCall('/auth/forgot-password', 'POST', { email });
                alertBox.className = 'alert-box alert-success';
                alertBox.textContent = res.message || 'If that email exists in our records, a reset link/code has been sent.';
                alertBox.style.display = 'block';
                document.getElementById('forgotForm').reset();
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.textContent = err.message || 'Unable to process request. Please try again.';
                alertBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" style="width: 17px; height: 17px;"></i><span>Send Reset Link</span>';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
